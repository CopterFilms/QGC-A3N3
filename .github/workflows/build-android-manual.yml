name: Build Android (Manual/Spike)

# Reuses the upstream Android CI to produce an installable APK for this fork.
# Ofrecido por CopterFilms para el spike de build: permite disparar el build
# Android desde la UI de Github Actions sin esperar un push a master.
# La logica de build es identica al workflow android.yml upstream.
#
# Nota: este archivo se anade a .github/workflows para forzar a GitHub Actions
# a re-escanear la carpeta e indexar todos los demas workflows (android.yml, ...)
# en este repositorio recien clonado.

on:
  workflow_dispatch:

concurrency:
  group: build-android-manual-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    name: Android (spike)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      BUILD_TYPE: Release
      PACKAGE: QGroundControl
      QT_ANDROID_ABIS: arm64-v8a

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set Android SDK location
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"

      - name: Build Setup (Android)
        id: setup
        uses: ./.github/actions/build-setup
        with:
          mode: android
          qt-host: linux
          qt-arch: linux_gcc_64
          abis: ${{ env.QT_ANDROID_ABIS }}
          build-type: ${{ env.BUILD_TYPE }}
          cpm-modules: ${{ runner.temp }}/build/cpm_modules

      - name: Install host build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-dependencies

      - name: Create Debug Keystore
        shell: bash
        run: |
          keytool -genkey -v \
            -keystore "${RUNNER_TEMP}/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "QT_ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/debug.keystore"
            echo "QT_ANDROID_KEYSTORE_ALIAS=androiddebugkey"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=android"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=android"
          } >> "$GITHUB_ENV"

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ env.BUILD_TYPE }}
          preset: Android
          use-qt-cmake: 'false'
          extra-args: >-
            -DCMAKE_WARN_DEPRECATED=FALSE
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup.outputs.target_qt_root_dir }}/lib/cmake/Qt6/qt.toolchain.cmake
            -DCMAKE_PREFIX_PATH=${{ steps.setup.outputs.target_qt_root_dir }}
            -DQT_ANDROID_ABIS=${{ env.QT_ANDROID_ABIS }}
            -DQT_HOST_PATH=${{ steps.setup.outputs.host_qt_root_dir }}
            -DQT_ANDROID_SIGN_APK=ON

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ env.BUILD_TYPE }}
          output-file: qgc-build.log

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}-spike
          path: ${{ runner.temp }}/build/android-build/*.apk
          if-no-files-found: error